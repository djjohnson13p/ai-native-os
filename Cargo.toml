[workspace]
members = [
    "crates/aios-contracts",
    "crates/aios-registry",
    "crates/aios-ir",
    "crates/aios-provenance",
    "crates/aios-task-manager",
    "cmd/aios-ir",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
aios-contracts = { path = "crates/aios-contracts" }
aios-ir = { path = "crates/aios-ir" }
aios-provenance = { path = "crates/aios-provenance" }
aios-registry = { path = "crates/aios-registry" }
cap-std = "=4.0.3"
fs2 = "0.4.3"
clap = { version = "4.5.48", features = ["derive"] }
jsonschema = { version = "=0.37.4", default-features = false }
proptest = "1.8.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.11.0"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
rustix = { version = "=1.1.5", features = ["process"] }

[workspace.dependencies.winx]
version = "=0.36.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
